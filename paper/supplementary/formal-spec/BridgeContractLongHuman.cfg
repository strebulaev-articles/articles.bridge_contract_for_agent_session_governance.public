\* TLC configuration for BridgeContract.tla (safety), T_human above T_detach (allowed where the client is attached).
\*
\*   java -cp tla2tools.jar tlc2.TLC -config BridgeContractLongHuman.cfg \
\*        -workers auto -deadlock BridgeContract.tla
\*
\* One session, MaxEvents = 5.

SPECIFICATION Spec

INVARIANT Inv
VIEW SafetyView
PROPERTY StepProps

CONSTANTS
    Sessions = {s1}
    Clients = {"c1", "c2"}
    Perms = {"p1", "p2"}
    Keys = {"k1", "k2"}
    TDetach = 4
    THuman = 6
    TNonce = 2
    MaxNonce = 2
    AdvKeys = {"x"}
    AttackOn = FALSE
    ObsMax = 0
    LiveLimit = 1
    FailMax = 1
    TTotal = 6
    DetPolicy = "refuse"
    Allow = {"p1"}
    TCall = 3
    TApprove = 2
    QMax = 1
    MaxEvents = 5
    MaxRestarts = 1
    AllowFaults = TRUE

