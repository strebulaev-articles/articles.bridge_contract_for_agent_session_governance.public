\* TLC configuration for BridgeContract.tla (safety), policy forward: allowlisted calls are forwarded away.
\*
\*   java -cp tla2tools.jar tlc2.TLC -config BridgeContractForward.cfg \
\*        -workers auto -deadlock BridgeContract.tla
\*
\* One session, MaxEvents = 6.

SPECIFICATION Spec

INVARIANT Inv
VIEW SafetyView
PROPERTY StepProps

CONSTANTS
    Sessions = {s1}
    Clients = {"c1", "c2"}
    Perms = {"p1", "p2"}
    Keys = {"k1", "k2"}
    TDetach = 4
    THuman = 4
    TNonce = 2
    MaxNonce = 2
    AdvKeys = {"x"}
    AttackOn = FALSE
    ObsMax = 0
    LiveLimit = 1
    FailMax = 1
    TTotal = 6
    DetPolicy = "forward"
    Allow = {"p1"}
    TCall = 3
    TApprove = 2
    QMax = 1
    MaxEvents = 6
    MaxRestarts = 1
    AllowFaults = TRUE
    GhostOn = TRUE

