\* TLC configuration for BridgeContract.tla (safety), the nonce book and the failure record above one.
\*
\*   java -cp tla2tools.jar tlc2.TLC -config BridgeContractBook.cfg \
\*        -workers auto -deadlock BridgeContract.tla
\*
\* (-deadlock turns deadlock checking off: bounded actions legitimately stop.)
\* One session.  LiveLimit = 2 with MaxNonce = 3, so a challenge is issued while
\* another nonce is live (the no-eviction rule of I11 (f) reads over a non-empty
\* set) and a further challenge meets a full book; FailMax = 2.  Narrow in
\* everything else: one permission, one call key, no log tampering.

SPECIFICATION Spec

INVARIANT Inv
VIEW SafetyView
PROPERTY StepProps

CONSTANTS
    Sessions = {s1}
    Clients = {"c1", "c2"}
    Perms = {"p1"}
    Keys = {"k1"}
    TDetach = 4
    THuman = 4
    TNonce = 2
    MaxNonce = 3
    AdvKeys = {"x"}
    AttackOn = FALSE
    ObsMax = 0
    LiveLimit = 2
    FailMax = 2
    TTotal = 6
    DetPolicy = "refuse"
    Allow = {"p1"}
    TCall = 3
    TApprove = 2
    QMax = 1
    MaxEvents = 5
    MaxRestarts = 1
    AllowFaults = FALSE
    GhostOn = TRUE
