\* TLC configuration for BridgeContract.tla (safety, attacker).
\*
\*   java -cp tla2tools.jar tlc2.TLC -config BridgeContractAttack.cfg \
\*        -workers auto -deadlock BridgeContract.tla
\*
\* (-deadlock turns deadlock checking off: bounded actions legitimately stop.)
\* One session, the attacker on (AttackOn), narrow in everything that does not
\* concern it: one permission, one call key, no log tampering, MaxEvents = 5.
\* The other configurations run without the attacker; see README.md.

SPECIFICATION Spec

INVARIANT Inv
VIEW SafetyView
PROPERTY StepProps

CONSTANTS
    Sessions = {s1}
    Clients = {"c1", "c2"}
    Perms = {"p1"}
    Keys = {"k1"}
    TDetach = 4
    THuman = 4
    TNonce = 2
    MaxNonce = 2
    AdvKeys = {"x"}
    AttackOn = TRUE
    ObsMax = 2
    LiveLimit = 1
    FailMax = 1
    TTotal = 6
    DetPolicy = "refuse"
    Allow = {"p1"}
    TCall = 3
    TApprove = 2
    QMax = 1
    MaxEvents = 5
    MaxRestarts = 1
    AllowFaults = FALSE
    GhostOn = TRUE
