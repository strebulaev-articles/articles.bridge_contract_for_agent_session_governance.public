\* TLC configuration for the liveness properties L1, L1Res and L2 (one session;
\* fair scheduling of the timers and of verification, axiom A6).
\*
\*   java -cp tla2tools.jar tlc2.TLC -config BridgeContractLive.cfg \
\*        -workers auto -deadlock BridgeContract.tla

SPECIFICATION FairSpec

PROPERTY L1
PROPERTY L1Res
PROPERTY L2
PROPERTY CapEnds

CONSTANTS
    Sessions = {s1}
    Clients = {"c1", "c2"}
    Perms = {"p1", "p2"}
    Keys = {"k1", "k2"}
    TDetach = 4
    THuman = 4
    TNonce = 2
    MaxNonce = 2
    AdvKeys = {"x"}
    AttackOn = FALSE
    ObsMax = 0
    LiveLimit = 1
    FailMax = 1
    TTotal = 6
    DetPolicy = "refuse"
    Allow = {"p1"}
    TCall = 3
    TApprove = 2
    QMax = 1
    MaxEvents = 5
    MaxRestarts = 1
    AllowFaults = TRUE
    GhostOn = FALSE
